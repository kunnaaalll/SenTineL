# Sentinel standalone local stack (spec section 14.1).
#
#   offline start:    cd <repo-root> && docker compose -f infra/docker-compose.yml up --build
#   provider-enabled: cp .env.example .env, fill in credentials, same command
#
# Scope: backend + frontend. No APEX (Sentinel must run fully standalone).
# The Next.js frontend runs as a sibling service talking to the backend over
# the internal bridge network via BACKEND_ORIGIN=http://backend:8000.
#
# Configuration channels:
#   * Backend: All credentials and tunables flow through env_file (../.env)
#     or settings.py defaults.
#   * Frontend: BACKEND_ORIGIN is set to the internal compose service URL
#     (http://backend:8000). The browser only talks to the frontend origin,
#     and the Next.js server proxies /backend/* calls to FastAPI.
#   * Compose interpolation knobs (SENTINEL_IMAGE_TAG, SENTINEL_API_BIND,
#     SENTINEL_API_PORT, SENTINEL_FRONTEND_BIND, SENTINEL_FRONTEND_PORT)
#     are interpolated from the shell or infra/.env.
#
# Requires: Docker Compose v2.24+ (env_file.required).

name: sentinel

services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    image: sentinel-backend:${SENTINEL_IMAGE_TAG:-local}
    container_name: sentinel-backend

    # v1 ships NO authentication (spec section 17): publish on loopback only.
    # For a private-network deployment set SENTINEL_API_BIND explicitly.
    ports:
      - "${SENTINEL_API_BIND:-127.0.0.1}:${SENTINEL_API_PORT:-8000}:8000"

    # All credential material and tunables flow through here. The file is
    # optional so the stack boots offline with zero configuration.
    env_file:
      - path: ../.env
        required: false

    restart: unless-stopped
    stop_grace_period: 25s

    # Hardening: immutable root filesystem, no privilege escalation, all
    # capabilities dropped; writable state confined to a bounded tmpfs.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - sentinel

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
    image: sentinel-frontend:${SENTINEL_IMAGE_TAG:-local}
    container_name: sentinel-frontend

    ports:
      - "${SENTINEL_FRONTEND_BIND:-127.0.0.1}:${SENTINEL_FRONTEND_PORT:-3000}:3000"

    environment:
      - BACKEND_ORIGIN=http://backend:8000

    depends_on:
      - backend

    restart: unless-stopped
    stop_grace_period: 15s

    security_opt:
      - no-new-privileges:true

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - sentinel

networks:
  sentinel:
    driver: bridge
