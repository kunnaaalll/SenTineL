# Fast local gates: file hygiene + ruff (format + lint). Mypy and the test
# suite run in CI (see .github/workflows/ci.yml) — keeping hooks fast.
# Install: make hooks  (requires git init first)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff          # lint, with safe autofixes
        args: [--fix]
      - id: ruff-format

exclude: '\.venv/'
