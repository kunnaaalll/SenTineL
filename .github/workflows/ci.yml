# Sentinel CI — runs the full offline gate on every push and PR:
# formatting check, lint, static types, tests. Installs from the pinned
# lockfile so CI matches local environments exactly.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-lock.txt

      - name: Formatting check (ruff format)
        run: ruff format --check .

      - name: Lint (ruff check)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy .

      - name: Tests (offline suite)
        run: pytest
